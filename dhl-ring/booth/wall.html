<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoarFun — Wall display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Azeret+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFCC00; --panel:rgba(255,255,255,.82);
    --line:rgba(0,0,0,.12); --line-strong:rgba(0,0,0,.22);
    --txt:#111111; --dim:#555555; --dimmer:#888888;
    --accent:#D40511; --gold:#B8860B; --silver:#8A8A8A; --bronze:#A0632B;
    --ok:#3FB56B; --warn:#F2C14E;
    --cond:"Barlow Condensed","Arial Narrow",sans-serif;
    --mono:"Azeret Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--cond);
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #bg{position:absolute;inset:0;background:#000 center/cover no-repeat}
  #bg.grad{background:#FFCC00}
  /* scrim removed for the DHL yellow theme so the background stays true */

  #tower{position:relative;z-index:2;width:min(1120px,92vw);height:92vh;
    display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.28)}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding:22px 30px 16px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:15px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin:0 0 4px}
  h1{font-size:40px;line-height:.98;font-weight:700;text-transform:uppercase;margin:0}
  .stat{text-align:right;white-space:nowrap}
  .stat .k{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .stat .v{font-family:var(--mono);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
  .stat .v.best{color:var(--gold)}

  .cols{display:grid;grid-template-columns:78px 1fr auto;padding:10px 30px;
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dimmer);
    border-bottom:1px solid var(--line)}
  .cols .r{text-align:right}

  #wrap{position:relative;overflow:hidden;flex:1}
  #rows{position:absolute;left:0;right:0;top:0;transition:transform .9s cubic-bezier(.4,0,.2,1)}
  .row{display:grid;grid-template-columns:78px 1fr auto;align-items:center;
    padding:12px 30px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  .pos{font-family:var(--mono);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;
    color:var(--dim);position:relative;padding-left:12px}
  .row.p1 .pos,.row.p2 .pos,.row.p3 .pos{color:var(--txt)}
  .row.p1 .pos::before,.row.p2 .pos::before,.row.p3 .pos::before{content:"";position:absolute;
    left:0;top:50%;transform:translateY(-50%);width:4px;height:60%;border-radius:2px}
  .row.p1 .pos::before{background:var(--gold)}
  .row.p2 .pos::before{background:var(--silver)}
  .row.p3 .pos::before{background:var(--bronze)}
  .name{font-size:29px;font-weight:600;text-transform:uppercase;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .row.p1 .name{font-size:32px;font-weight:700}
  .team{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:2px}
  .time{font-family:var(--mono);font-weight:500;font-size:30px;font-variant-numeric:tabular-nums;
    text-align:right;padding-left:24px}
  .row.p1 .time{color:var(--gold);font-weight:700}

  /* highlight when a row is being presented */
  .row.spot{background:rgba(212,5,17,.10)}
  .row.spot::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 20%,rgba(242,193,78,.45) 50%,transparent 80%);
    background-size:250% 100%;animation:sweep 1.1s ease-out}
  .row.spot .time{animation:pop 1.1s ease-out}
  @keyframes sweep{0%{background-position:-30% 0}100%{background-position:150% 0}}
  @keyframes pop{0%{color:var(--gold);transform:scale(1.06)}100%{transform:none}}

  #empty{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:var(--dim);text-align:center}
  #empty h2{font-size:30px;font-weight:600;color:var(--txt);margin:0 0 8px;text-transform:uppercase}

  #live{position:fixed;top:16px;right:16px;z-index:20;display:flex;align-items:center;gap:8px;
    padding:8px 14px;border:1px solid rgba(0,0,0,.15);border-radius:999px;background:rgba(255,255,255,.7);
    backdrop-filter:blur(4px);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  #live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  #live.stale{border-color:rgba(242,193,78,.5);color:var(--warn)}
  #live.stale .dot{background:var(--warn)}
  #live.down{border-color:rgba(232,52,42,.5);color:#ff8b84}
  #live.down .dot{background:var(--accent)}
  #fs{position:fixed;bottom:16px;right:16px;z-index:30;width:46px;height:46px;
    border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.7);color:#111;
    border-radius:10px;cursor:pointer;font-size:19px;opacity:.4;transition:opacity .2s}
  #fs:hover{opacity:1}
  @media (max-width:640px){h1{font-size:28px}.name{font-size:22px}.time{font-size:22px}.pos{font-size:22px}}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="grad"></div>
  <div id="tower">
    <div class="head">
      <div><p class="eyebrow">Lap leaderboard</p><h1 id="title">DHL The Ring</h1></div>
      <div style="display:flex;gap:26px">
        <div class="stat"><div class="k">Drivers</div><div class="v" id="s-count">0</div></div>
        <div class="stat"><div class="k">Best lap</div><div class="v best" id="s-best">—</div></div>
      </div>
    </div>
    <div class="cols"><div>Pos</div><div>Driver</div><div class="r">Lap time</div></div>
    <div id="wrap">
      <div id="rows"></div>
      <div id="empty"><h2>No laps yet</h2><p>The first result appears here in a moment.</p></div>
    </div>
  </div>
</div>
<div id="live"><span class="dot"></span><span id="live-text">Live</span></div>
<button id="fs" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>

<script>
/* Local wall display. Reads the booth hub on the same machine, so it works with
   no internet. Options:  ?top=10   how many rows to show at rest (default 10)
                          ?title=…  heading override                            */
const params  = new URLSearchParams(location.search);
const TOP_N   = Math.max(3, parseInt(params.get("top") || "10", 10));
const SRC     = params.get("src") || "/api/leaderboard";
const REFRESH = 3000;
const HOLD_MS = parseInt(params.get("hold") || "10000", 10);
const SETTLE  = parseInt(params.get("settle") || "950", 10);
const BATCH_LIMIT = parseInt(params.get("batch") || "3", 10);  // >this many new = bulk load, don't parade

const rowsEl = document.getElementById("rows");
const wrapEl = document.getElementById("wrap");
const emptyEl = document.getElementById("empty");
const liveEl = document.getElementById("live");
const liveText = document.getElementById("live-text");

let board = [];               // full current board
let known = new Map();        // id -> best_lap_ms last seen
let primed = false;
let updatedAt = null;

let presenting = false;       // a scroll-and-hold sequence is running
let presentingId = null;      // the id on screen right now, so it isn't re-queued
const queue = [];             // ids waiting to be presented (finish order)

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");

function rowHeight(){
  const r = rowsEl.querySelector(".row");
  return r ? r.getBoundingClientRect().height : 64;
}
function visibleCount(){
  return Math.max(1, Math.round(wrapEl.clientHeight / rowHeight()));
}

function renderRows(){
  emptyEl.style.display = board.length ? "none" : "flex";
  rowsEl.innerHTML = board.map(e => {
    const cls = e.rank <= 3 ? " p" + e.rank : "";
    return '<div class="row' + cls + '" data-id="' + esc(e.id) + '">' +
      '<div class="pos">' + pad(e.rank) + '</div>' +
      '<div><div class="name">' + esc(e.name) + '</div>' +
        (e.team ? '<div class="team">' + esc(e.team) + '</div>' : '') + '</div>' +
      '<div class="time">' + esc(e.best_lap) + '</div></div>';
  }).join("");
}

function scrollToTop(){ rowsEl.style.transform = "translateY(0)"; }

/* Scroll so the target row sits comfortably in view (centred, clamped to ends). */
function scrollToRow(rank){
  const h = rowHeight();
  const total = board.length * h;
  const view = wrapEl.clientHeight;
  const target = (rank - 1) * h;                 // top of the target row
  let y = target - (view - h) / 2;               // centre it
  y = Math.max(0, Math.min(y, Math.max(0, total - view)));
  rowsEl.style.transform = "translateY(" + (-y) + "px)";
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function runQueue(){
  if (presenting) return;
  presenting = true;
  while (queue.length){
    const id = queue.shift();
    const entry = board.find(e => e.id === id);
    if (!entry) continue;                         // dropped off since queued
    if (entry.rank <= visibleCount()) continue;   // now within the resting view anyway

    presentingId = id;
    // Scroll using the live rank, then re-read it after the scroll settles —
    // a poll may have re-rendered the rows in between, so look the element up
    // fresh and spotlight by id, never by a stale reference or position.
    scrollToRow(entry.rank);
    await wait(SETTLE);
    const live = board.find(e => e.id === id);
    if (live) scrollToRow(live.rank);              // correct for any shift during settle
    const rowEl = rowsEl.querySelector('[data-id="' + CSS.escape(id) + '"]');
    if (rowEl) rowEl.classList.add("spot");
    await wait(HOLD_MS);
    const stillThere = rowsEl.querySelector('[data-id="' + CSS.escape(id) + '"]');
    if (stillThere) stillThere.classList.remove("spot");
    presentingId = null;
    // If more are waiting, go straight to the next one — no bounce back to top.
  }
  // Queue drained: settle back to the top N.
  scrollToTop();
  presenting = false;
}

function apply(data){
  board = data.leaderboard || [];
  document.getElementById("title").textContent =
    params.get("title") || "DHL The Ring 10th edition";
  document.getElementById("s-count").textContent = data.count || 0;
  document.getElementById("s-best").textContent = board.length ? board[0].best_lap : "—";

  renderRows();

  // Find new or improved entries that landed OUTSIDE the resting view.
  const vis = visibleCount();
  const fresh = [];
  for (const e of board){
    const was = known.get(e.id);
    const isNew = was === undefined;
    const improved = was !== undefined && e.best_lap_ms < was;
    if (primed && (isNew || improved) && e.rank > vis
        && !queue.includes(e.id) && e.id !== presentingId){
      fresh.push(e.id);
    }
  }

  // A handful of new out-of-view finishes are the real "someone just set a lap"
  // case — present each. But a large batch (first fill of the day, a reconnect
  // catching up, a bulk import) would otherwise scroll through dozens of rows
  // for minutes. Above the batch threshold, just render it and stay at the top.
  if (fresh.length && fresh.length <= BATCH_LIMIT){
    for (const id of fresh) queue.push(id);
  }

  // Record everything as seen AFTER the decision, so a repeated poll of the same
  // board can't absorb an entry before it's been considered.
  known = new Map(board.map(e => [e.id, e.best_lap_ms]));
  primed = true;

  if (queue.length) runQueue();
  else if (!presenting) scrollToTop();
}

function showState(){
  if (!updatedAt){ liveEl.className = "stale"; liveText.textContent = "Waiting"; return; }
  const age = Math.round((Date.now() - updatedAt) / 1000);
  if (age < 90){ liveEl.className = ""; liveText.textContent = "Live"; }
  else if (age < 300){ liveEl.className = "stale"; liveText.textContent = age + "s ago"; }
  else { liveEl.className = "down"; liveText.textContent = Math.round(age/60) + " min ago"; }
}

async function poll(){
  try{
    const r = await fetch(SRC, { cache: "no-store" });
    const data = await r.json();
    updatedAt = data.updated_at ? Date.parse(data.updated_at) : Date.now();
    apply(data);
  }catch(e){ liveEl.className = "down"; liveText.textContent = "Offline"; }
  showState();
}

/* Background image: if the hub serves /assets/background.jpg, use it; else plain yellow. */
(function(){
  const bg = document.getElementById("bg");
  const probe = new Image();
  probe.onload = () => { bg.classList.remove("grad");
    bg.style.background = 'url("/assets/background.jpg") center/cover no-repeat'; };
  probe.onerror = () => {};   // keep the flat DHL yellow
  probe.src = "/assets/background.jpg?" + Date.now();
})();

document.getElementById("fs").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};

poll();
setInterval(poll, REFRESH);
setInterval(showState, 1000);
</script>
</body>
</html>
